<title>LingoVerse</title>

<style>
/* Layout: sticky header, sidebar nav plus one working column. The dashboard hero carries a ghosted greeting in the language being learned. */
:root{
  --bg:#0c0a1b; --surface:#151230; --surface-2:#1e1a42; --line:#2c2759;
  --fg:#ece9fb; --muted:#a29cc8;
  --accent:#7c3aed; --accent-hover:#8b5cf6; --accent-ink:#ffffff; --accent-text:#c4b5fd; --accent-soft:rgba(139,92,246,.16);
  --good:#34d399; --good-soft:rgba(52,211,153,.14);
  --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14);
  --bad:#f87171; --bad-soft:rgba(248,113,113,.14);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --f-display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI','Hiragino Sans','Yu Gothic','PingFang SC','Microsoft YaHei',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f4fd; --surface:#ffffff; --surface-2:#efeafc; --line:#ddd6f3;
    --fg:#1b1633; --muted:#5d5683;
    --accent:#6d28d9; --accent-hover:#5b21b6; --accent-ink:#ffffff; --accent-text:#5b21b6; --accent-soft:rgba(109,40,217,.09);
    --good:#047857; --good-soft:rgba(4,120,87,.11);
    --warn:#b45309; --warn-soft:rgba(180,83,9,.11);
    --bad:#b91c1c; --bad-soft:rgba(185,28,28,.09);
    --shadow:0 1px 2px rgba(27,22,51,.06),0 10px 28px rgba(27,22,51,.07);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f6f4fd; --surface:#ffffff; --surface-2:#efeafc; --line:#ddd6f3;
  --fg:#1b1633; --muted:#5d5683;
  --accent:#6d28d9; --accent-hover:#5b21b6; --accent-ink:#ffffff; --accent-text:#5b21b6; --accent-soft:rgba(109,40,217,.09);
  --good:#047857; --good-soft:rgba(4,120,87,.11);
  --warn:#b45309; --warn-soft:rgba(180,83,9,.11);
  --bad:#b91c1c; --bad-soft:rgba(185,28,28,.09);
  --shadow:0 1px 2px rgba(27,22,51,.06),0 10px 28px rgba(27,22,51,.07);
  color-scheme:light;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent-hover);outline-offset:2px}
.ic{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 22px/1 var(--f-display)}
.brand-name{display:block;font:800 19px/1.1 var(--f-display);letter-spacing:-.01em}
.brand-sub{display:block;font-size:12px;color:var(--muted)}
.stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13px;font-variant-numeric:tabular-nums}
.pill.warn{color:var(--warn)}
.pill.xp{color:var(--accent-text)}
.pill b{font-weight:700}
button.pill{cursor:pointer}
button.pill:hover{border-color:var(--accent)}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;padding-block:28px 72px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:600;font-size:14px;text-align:left;cursor:pointer}
.nav button:hover{background:var(--surface);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav .sep{height:1px;background:var(--line);margin:8px 4px}
.langcard{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.langcard .badge{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:800;font-size:13px}
.langcard .meta{flex:1;min-width:0}
.langcard .meta b{display:block;font-size:14px}
.langcard .meta span{font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent-text);font-weight:600;font-size:13px;cursor:pointer;padding:4px}
.linkbtn:hover{text-decoration:underline}

/* generic */
.view{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h2{font:800 22px/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
h3{font:700 17px/1.3 var(--f-display)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-text)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:1px solid transparent;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;cursor:pointer}
.btn:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--accent)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-size:12px;font-weight:700;text-transform:capitalize}

/* dashboard */
.callout{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 18px;border:1px solid var(--accent);border-radius:14px;background:var(--accent-soft)}
.callout b{display:block}
.callout span{color:var(--muted);font-size:13.5px}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:clamp(22px,4vw,38px);display:flex;flex-direction:column;gap:14px}
.hero>*{position:relative}
.ghost{position:absolute!important;right:-.04em;top:-.12em;font:800 clamp(5rem,17vw,10.5rem)/1 var(--f-display);color:var(--accent-soft);letter-spacing:-.04em;pointer-events:none;user-select:none;white-space:nowrap}
.hero h1{font:800 clamp(1.9rem,4.6vw,2.9rem)/1.05 var(--f-display);letter-spacing:-.02em;max-width:15ch;text-wrap:balance}
.lede{max-width:52ch;color:var(--muted);font-size:16px}
.ranks{list-style:none;margin:10px 0 0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.ranks li{display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);background:var(--bg)}
.ranks li .dot{width:8px;height:8px;border-radius:50%;border:2px solid var(--muted)}
.ranks li.done{color:var(--fg)}
.ranks li.done .dot{background:var(--good);border-color:var(--good)}
.ranks li.now{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
.ranks li.now .dot{background:var(--accent-hover);border-color:var(--accent-hover)}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px}
.glyphs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.glyph{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:16px 12px;text-align:center;display:flex;flex-direction:column;gap:4px}
.glyph .g{font:800 34px/1.1 var(--f-display);color:var(--accent-text)}
.glyph .s{font-weight:700;font-size:13.5px}
.glyph .n{font-size:12px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.week i{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--accent-ink)}
.week i.on{background:var(--accent);border-color:var(--accent)}
.week .today span{color:var(--fg);font-weight:700}

/* flashcards */
.flash{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:28px;border:1px solid var(--line);border-radius:20px;background:var(--bg);cursor:pointer;max-width:520px;width:100%;margin-inline:auto}
.flash:hover{border-color:var(--accent)}
.flash .big{font:800 clamp(1.9rem,6.5vw,3rem)/1.1 var(--f-display);overflow-wrap:anywhere;letter-spacing:-.01em}
.flash .big.back{color:var(--good)}
.flash .ex{font-style:italic;color:var(--muted);max-width:34ch}
.deckbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.count{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:64px;text-align:center}

/* writing + speaking */
.prompt{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.target{font:700 20px/1.35 var(--f-display);color:var(--accent-text);overflow-wrap:anywhere}
.hints{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:12px;padding:3px 10px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
textarea{width:100%;min-height:110px;resize:vertical;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);line-height:1.5}
textarea:focus{border-color:var(--accent);outline:none}
.field{display:flex;flex-direction:column;gap:8px}
label.lab{font-size:13px;font-weight:600}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.fb{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.fb.good{border-color:var(--good);background:var(--good-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb .score{font:800 20px/1 var(--f-display);font-variant-numeric:tabular-nums}
.fb.good .score{color:var(--good)}
.fb.bad .score{color:var(--bad)}
.cmp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.cmp dt{color:var(--muted)}
.cmp dd{margin:0;overflow-wrap:anywhere}
.say{font:800 clamp(1.5rem,4.4vw,2.2rem)/1.25 var(--f-display);overflow-wrap:anywhere}
.steps{display:flex;gap:8px;flex-wrap:wrap;list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted)}
.steps li{padding:5px 12px;border:1px solid var(--line);border-radius:999px}

/* quizzes */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.opt{padding:13px 14px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--fg)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--fg)}
.opt:disabled{cursor:default}
.qbox{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qtext{font-weight:700;font-size:16px}
.tq{color:var(--accent-text)}
.streakpill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--good-soft);color:var(--good);font-size:13px;font-weight:700}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
.result .big{font:800 clamp(2.4rem,8vw,3.6rem)/1 var(--f-display);font-variant-numeric:tabular-nums}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.review li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);font-size:14px}

/* toast + modal */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(92vw,440px);padding:11px 18px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;box-shadow:var(--shadow);text-align:center}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,6,20,.72);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);max-height:100%;overflow-y:auto}
.modal h2{font-size:24px}
.langgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.lang-opt{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;cursor:pointer;font-weight:700}
.lang-opt span{font-weight:500;font-size:13px;color:var(--muted)}
.lang-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.level{padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-weight:700;text-transform:capitalize;cursor:pointer}
.level[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
input[type=text]:focus{border-color:var(--accent);outline:none}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:18px 64px}
  .side{position:static}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav button{width:auto;white-space:nowrap;border:1px solid var(--line);flex:none}
  .nav .sep{display:none}
  .cols{grid-template-columns:minmax(0,1fr)}
  .brand-sub{display:none}
}
@media (max-width:420px){
  .card{padding:16px}
  .btn{padding:10px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap top-inner" id="top-inner"></div></header>
<div class="wrap shell">
  <aside class="side" id="side"></aside>
  <main class="view" id="view"></main>
</div>

<script>
var DATA=(function(){
  var RANKS=['beginner','intermediate','advanced','master'];
  var LANGS={
    Spanish:{voice:'es-ES',tag:'es',greet:'Hola',short:'ES'},
    French:{voice:'fr-FR',tag:'fr',greet:'Bonjour',short:'FR'},
    German:{voice:'de-DE',tag:'de',greet:'Hallo',short:'DE'},
    Japanese:{voice:'ja-JP',tag:'ja',greet:'こんにちは',short:'JA'},
    Mandarin:{voice:'zh-CN',tag:'zh-Hans',greet:'你好',short:'ZH'},
    Italian:{voice:'it-IT',tag:'it',greet:'Ciao',short:'IT'}
  };

  var WRITING={
    Spanish:{
      beginner:[
        {task:"Write a simple friendly greeting",targetPhrase:"Hola mi amigo",translation:"Hello my friend",hints:["Use 'Hola'"]},
        {task:"Say thank you politely",targetPhrase:"Muchas gracias",translation:"Thank you very much",hints:["Express gratitude"]},
        {task:"Say goodbye for tomorrow",targetPhrase:"Hasta mañana",translation:"See you tomorrow",hints:["Common departure"]},
        {task:"Ask how someone is doing",targetPhrase:"¿Cómo estás tú?",translation:"How are you?",hints:["Use '¿Cómo'"]},
        {task:"Introduce your name",targetPhrase:"Me llamo Juan",translation:"My name is Juan",hints:["Use 'Me llamo'"]}
      ],
      intermediate:[
        {task:"Order a warm coffee at a café",targetPhrase:"Quisiera un café caliente, por favor",translation:"I would like a hot coffee, please",hints:["Polite ordering verb"]},
        {task:"Ask for directions to the station",targetPhrase:"¿Dónde está la estación de tren?",translation:"Where is the train station?",hints:["Question word 'Dónde'"]},
        {task:"Ask for the bill at a restaurant",targetPhrase:"La cuenta, por favor",translation:"The bill, please",hints:["Restaurant phrase"]},
        {task:"Ask about the price of an item",targetPhrase:"¿Cuánto cuesta esta camiseta?",translation:"How much does this shirt cost?",hints:["Use '¿Cuánto'"]}

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function z(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function today(){return ymd(new Date())}
function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return d}
function I(n){return '<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

}
function load(){
  var raw=store('lingoverse_state');if(!raw)return;
  try{
    var d=JSON.parse(raw);
    if(d.user&&d.user.name)S.user={name:String(d.user.name)};
    if(LANGS[d.lang])S.lang=d.lang;
    if(d.ranks&&typeof d.ranks==='object'){RANKS.forEach(function(){});Object.keys(LANGS).forEach(function(l){if(RANKS.indexOf(d.ranks[l])>-1)S.ranks[l]=d.ranks[l]})}

    if(typeof d.streak==='number')S.streak=d.streak;
    if(typeof d.last==='string')S.last=d.last;
    if(Array.isArray(d.history))S.history=d.history.filter(function(x){return typeof x==='string'});

  if(S.last!==today()&&S.last!==ymd(daysAgo(1)))S.streak=0;

/* ---------- content access ---------- */
function vocab(lang,r){return (D.VOCAB[lang][r]||[]).map(function(v){return {term:v[0],meaning:v[1],say:v[2],ex:v[3]}})}
function prompts(lang,r){return D.WRITING[lang][r]||D.WRITING[lang].beginner}
function items(lang,upto){
  var out=[];
  RANKS.slice(0,RANKS.indexOf(upto)+1).forEach(function(r){
    vocab(lang,r).forEach(function(v){out.push({t:v.term,m:v.meaning,r:r,kind:'word'})});
    (D.WRITING[lang][r]||[]).forEach(function(w){out.push({t:w.targetPhrase,m:w.translation,r:r,kind:'phrase'})});
  });
  return out;
}
function makeQ(it,pool,dir,lang){
  var key=dir?'t':'m';
  var same=pool.filter(function(p){return p!==it&&p.kind===it.kind&&p[key]!==it[key]});
  var rest=pool.filter(function(p){return p!==it&&p.kind!==it.kind&&p[key]!==it[key]});
  var opts=[it[key]];
  shuffle(same).concat(shuffle(rest)).forEach(function(p){if(opts.length<4&&opts.indexOf(p[key])===-1)opts.push(p[key])});
  opts=shuffle(opts);
  var html=dir
    ?'How do you say <span class="tq">“'+esc(it.m)+'”</span> in '+lang+'?'
    :'What does <span class="tq" lang="'+LANGS[lang].tag+'">“'+esc(it.t)+'”</span> mean?';
  return {html:html,options:opts,correct:opts.indexOf(it[key]),tl:!!dir};
}
function fromBank(b){var opts=shuffle(b.slice(1));return {html:esc(b[0]),options:opts,correct:opts.indexOf(b[1]),tl:false}}

/* ---------- toast, streak, xp ---------- */
var toastTimer=null;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},3800);
}
function recordActivity(){
  var t=today();if(S.last===t)return null;
  S.streak=(S.last===ymd(daysAgo(1)))?S.streak+1:1;
  S.last=t;if(S.history.indexOf(t)<0)S.history.push(t);
  S.history=S.history.slice(-60);
  return S.streak;
}
function award(n){
  var st=recordActivity();S.xp+=n;save();renderHeader();
  toast('+'+n+' XP'+(st?' · '+st+'-day streak':''));
}

/* ---------- audio ---------- */
function speak(text,rate){
  try{
    var ss=window.speechSynthesis;
    if(!ss||typeof SpeechSynthesisUtterance==='undefined'){toast('Audio is not available in this browser.');return}
    ss.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang=LANGS[S.lang].voice;u.rate=rate||0.9;ss.speak(u);
  }catch(e){toast('Audio is not available here.')}
}

/* ---------- learning state resets ---------- */
function resetLearning(keepExam){
  S.card=0;S.flipped=false;
  S.write={idx:0,input:'',hide:S.write.hide,fb:null};
  S.speak={idx:0,done:false};
  S.quiz={q:null,picked:null,streak:0,lastKey:null};
  if(!keepExam)S.exam={qs:[],ans:{},submitted:false,score:0,rankedTo:null,review:[]};
}

/* ---------- writing scoring ---------- */
function norm(s,strip){
  var x=String(s).normalize('NFC').toLowerCase().replace(/[.,\/#!$%^&*;:{}=\-_`~()?¿¡"“”'’‘、。，！？・…]/g,' ').replace(/\s+/g,' ').trim();
  if(strip)x=x.normalize('NFD').replace(/[̀-ͯ]/g,'').normalize('NFC');
  return x;
}
function scoreWriting(input,target,rule){
  var tn=norm(target,rule.strip),inn=norm(input,rule.strip);
  var charMode=tn.indexOf(' ')===-1;
  var tt=charMode?Array.from(tn):tn.split(' ');
  var it=charMode?Array.from(inn.replace(/ /g, '')):(inn?inn.split(' '):[]);
  var left=it.slice(),m=0;
  tt.forEach(function(t){var i=left.indexOf(t);if(i>-1){left.splice(i,1);m++}});
  var acc=tt.length?m/tt.length*100:0;
  var exact=tn===inn;
  return {exact:exact,score:exact?100:Math.min(99,Math.round(acc*rule.mult))};
}

/* ---------- views ---------- */
function renderHeader(){
  $('#top-inner').innerHTML=
    '<a class="brand" href="#dashboard"><span class="mark" aria-hidden="true">L</span><span><span class="brand-name">LingoVerse</span><span class="brand-sub">Universal language academy</span></span></a>'+
    '<div class="stats">'+
      '<span class="pill warn" title="Daily streak">'+I('flame')+'<b>'+S.streak+'</b> '+(S.streak===1?'day':'days')+'</span>'+
      '<span class="pill xp" title="Experience points">'+I('star')+'<b>'+S.xp+'</b> XP</span>'+
      (S.user
        ?'<button class="pill" data-act="open-auth">'+I('user')+esc(S.user.name)+'</button>'
        :'<button class="btn btn-sm" data-act="open-auth">Create profile</button>')+
    '</div>';
}
function renderSide(){
  var nav=TABS.map(function(t,i){
    return (i===4?'<div class="sep"></div>':'')+'<button data-act="nav" data-tab="'+t.id+'"'+(S.tab===t.id?' aria-current="page"':'')+'>'+I(t.icon)+t.label+'</button>';
  }).join('');
  $('#side').innerHTML=
    '<nav class="nav" aria-label="Sections">'+nav+'</nav>'+
    '<div class="langcard"><div class="badge">'+LANGS[S.lang].short+'</div><div class="meta"><b>'+S.lang+'</b><span>'+cap(rank())+' tier</span></div>'+
    '<button class="linkbtn" data-act="open-onboard">Change</button></div>';
}

function vDashboard(){
  var lang=S.lang,r=rank(),ri=RANKS.indexOf(r),cfg=LANGS[lang];
  var banner=S.onboarded?'':
    '<div class="callout"><div><b>Choose your language and level</b><span>You are set to '+lang+' at Beginner. Change it any time.</span></div>'+
    '<button class="btn btn-sm" data-act="open-onboard">Choose</button></div>';
  var track=RANKS.map(function(x,i){
    return '<li class="'+(i<ri?'done':i===ri?'now':'')+'"><span class="dot"></span>'+cap(x)+'</li>';
  }).join('');
  var glyphs=D.SCRIPT[lang].map(function(g){
    return '<div class="glyph"><span class="g" lang="'+cfg.tag+'">'+esc(g[0])+'</span><span class="s">'+esc(g[1])+'</span><span class="n">'+esc(g[2])+'</span></div>';
  }).join('');
  var week='';
  for(var i=6;i>=0;i--){
    var d=daysAgo(i),on=S.history.indexOf(ymd(d))>-1;
    week+='<div class="'+(i===0?'today':'')+'"><i class="'+(on?'on':'')+'">'+(on?I('check'):'')+'</i><span>'+d.toLocaleDateString(undefined,{weekday:'short'})+'</span></div>';
  }
  return banner+
  '<section class="hero">'+
    '<div class="ghost" aria-hidden="true" lang="'+cfg.tag+'">'+esc(cfg.greet)+'</div>'+
    '<p class="eyebrow">Current rank · '+cap(r)+'</p>'+
    '<h1>Master '+lang+' step by step</h1>'+
    '<p class="lede">Work through vocabulary, writing and speaking, then pass the rank-up exam with a perfect score to move up.</p>'+
    '<div class="row"><button class="btn" data-act="nav" data-tab="vocab">Start next lesson '+I('arrow')+'</button>'+
    '<button class="btn btn-ghost" data-act="nav" data-tab="exam">Rank-up exam</button></div>'+
    '<ol class="ranks" aria-label="Rank progress">'+track+'</ol>'+
  '</section>'+
  '<div class="cols">'+
    '<section class="card"><div class="card-head"><div><p class="eyebrow">Sounds and script</p><h2>'+lang+' essentials</h2></div></div>'+
      '<p class="muted small" style="margin-bottom:14px">Sounds that are easy to miss when you are starting out.</p>'+
      '<div class="glyphs">'+glyphs+'</div></section>'+
    '<section class="card"><div class="card-head"><div><p class="eyebrow">Daily streak</p><h2>Last 7 days</h2></div></div>'+
      '<div class="week">'+week+'</div>'+
      '<p class="muted small" style="margin-top:14px">Finish any lesson or quiz to keep your streak going.</p></section>'+
  '</div>';
}

function vVocab(){
  var deck=vocab(S.lang,rank()),tag=LANGS[S.lang].tag;
  if(S.card>=deck.length)S.card=0;
  var c=deck[S.card];
  var face=S.flipped
    ?'<span class="eyebrow">Translation and usage</span><p class="big back">'+esc(c.meaning)+'</p><p class="ex" lang="'+tag+'">“'+esc(c.ex)+'”</p>'
    :'<span class="eyebrow">Target term</span><p class="big" lang="'+tag+'">'+esc(c.term)+'</p><p class="muted small">Sounds like: '+esc(c.say)+'</p>';
  return '<section class="card">'+
    '<div class="card-head"><div><p class="eyebrow">Flashcards</p><h2>Vocabulary in '+S.lang+'</h2></div><span class="tag">'+rank()+' deck</span></div>'+
    '<div class="flash" data-act="flip" data-key="flip-card">'+face+'</div>'+
    '<div class="deckbar">'+
      '<button class="btn btn-ghost btn-sm" data-act="prev" data-key="prev">Previous</button>'+
      '<span class="count">'+(S.card+1)+' of '+deck.length+'</span>'+
      '<button class="btn btn-sm" data-act="next" data-key="next">Next card</button>'+
    '</div>'+
    '<div class="deckbar" style="margin-top:10px">'+
      '<button class="btn btn-ghost btn-sm" data-act="flip" data-key="flip">'+I('refresh')+'Flip card</button>'+
      '<button class="btn btn-ghost btn-sm" data-act="say-card" data-key="say">'+I('volume')+'Listen</button>'+
    '</div></section>';
}

function curPrompt(){var p=prompts(S.lang,rank());return p[S.write.idx%p.length]}
function vWriting(){
  var p=curPrompt(),r=rank(),tag=LANGS[S.lang].tag,W=S.write,fb=W.fb;
  var target=W.hide?'<p class="muted small">Phrase hidden. Write it from the translation.</p>'
    :'<p class="small muted">Target phrase</p><p class="target" lang="'+tag+'">'+esc(p.targetPhrase)+'</p>';
  var hints=(p.hints||[]).map(function(h){return '<span class="hint">Hint: '+esc(h)+'</span>'}).join('');
  var fbHtml='';
  if(fb){
    fbHtml='<div class="fb '+(fb.passed?'good':'bad')+'" role="status">'+
      '<p class="score">'+fb.score+'/100</p>'+
      '<p>'+(fb.passed?(fb.exact?'Exact match. Nicely done.':'Passed for the '+cap(r)+' tier. Check the target below for anything you missed.'):'Not quite. Compare your answer with the target and try again.')+'</p>'+
      '<dl class="cmp"><dt>You wrote</dt><dd lang="'+tag+'">'+esc(fb.raw)+'</dd><dt>Target</dt><dd lang="'+tag+'">'+esc(fb.target)+'</dd></dl>'+
    '</div>';
  }
  return '<section class="card">'+
    '<div class="card-head"><div><p class="eyebrow">Writing studio</p><h2>'+esc(p.task)+'</h2></div><span class="tag">'+r+' tier</span></div>'+
    '<div class="prompt">'+target+'<p class="muted">Meaning: '+esc(p.translation)+'</p>'+(hints?'<div class="hints">'+hints+'</div>':'')+'</div>'+
    '<div class="field" style="margin-top:16px">'+
      '<label class="lab" for="write-input">Type your answer in '+S.lang+'</label>'+
      '<textarea id="write-input" lang="'+tag+'" placeholder="Type here in '+S.lang+'..."'+(fb&&fb.passed?' readonly':'')+'>'+esc(W.input)+'</textarea>'+
      '<div class="row">'+
        (fb&&fb.passed
          ?'<button class="btn" data-act="write-next" data-key="wnext">Next prompt '+I('arrow')+'</button>'
          :'<button class="btn" data-act="write-check" data-key="wcheck">Check writing</button>'+
           '<button class="btn btn-ghost" data-act="write-next" data-key="wskip">Skip prompt</button>')+
        '<label class="check"><input type="checkbox" id="write-hide"'+(W.hide?' checked':'')+'> Hide the phrase</label>'+
      '</div>'+
      '<p class="muted small">'+RULES[r].note+'</p>'+
    '</div>'+
    (fbHtml?'<div style="margin-top:16px">'+fbHtml+'</div>':'')+
  '</section>';
}

function vSpeaking(){
  var r=rank(),pool=prompts(S.lang,r),p=pool[S.speak.idx%pool.length],tag=LANGS[S.lang].tag,sc=D.SPEAK[r];
  return '<section class="card">'+
    '<div class="card-head"><div><p class="eyebrow">Scenario · '+esc(sc.title)+'</p><h2>Speaking studio</h2></div><span class="tag">'+r+' tier</span></div>'+
    '<div class="prompt">'+
      '<p class="say" lang="'+tag+'">'+esc(p.targetPhrase)+'</p>'+
      '<p class="muted">Meaning: '+esc(p.translation)+'</p>'+
      '<p class="muted small">Guide: '+esc((p.hints&&p.hints[0])||'Speak the phrase clearly')+'. '+esc(sc.tip)+'</p>'+
    '</div>'+
    '<ol class="steps" style="margin-top:16px"><li>1. Listen</li><li>2. Say it aloud</li><li>3. Mark it practiced</li></ol>'+
    '<div class="row" style="margin-top:14px">'+
      '<button class="btn btn-ghost" data-act="speak-play" data-key="sp1">'+I('volume')+'Listen</button>'+
      '<button class="btn btn-ghost" data-act="speak-slow" data-key="sp2">'+I('volume')+'Listen slowly</button>'+
      (S.speak.done
        ?'<button class="btn" data-act="speak-next" data-key="sp4">Next phrase '+I('arrow')+'</button>'
        :'<button class="btn" data-act="speak-done" data-key="sp3">'+I('mic')+'I said it aloud (+30 XP)</button>')+
    '</div>'+
    (S.speak.done?'<div class="fb good" style="margin-top:16px" role="status"><p class="score">Practice logged</p><p>Try it once more from memory, without the audio.</p></div>':'')+
    '<p class="muted small" style="margin-top:14px">This studio plays native-style audio and tracks practice. It does not record or score your voice.</p>'+
  '</section>';
}

function qBlock(q,picked,locked,attr){
  return '<div class="opts">'+q.options.map(function(o,i){
    var cls='opt';
    if(locked){if(i===q.correct)cls+=' right';else if(i===picked)cls+=' wrong'}
    else if(picked===i)cls+=' on';
    return '<button class="'+cls+'" '+attr(i)+(locked?' disabled':'')+(q.tl?' lang="'+LANGS[S.lang].tag+'"':'')+'>'+esc(o)+'</button>';
  }).join('')+'</div>';
}
function newQuiz(){
  var r=rank(),pool=items(S.lang,r),it,tries=0;
  do{it=pick(pool);tries++}while(it.t===S.quiz.lastKey&&tries<10&&pool.length>1);
  S.quiz.lastKey=it.t;S.quiz.picked=null;
  S.quiz.q=makeQ(it,items(S.lang,'master'),Math.random()<0.5?0:1,S.lang);
}
function vPractice(){
  var Q=S.quiz;if(!Q.q)newQuiz();
  var q=Q.q,locked=Q.picked!==null,ok=locked&&Q.picked===q.correct;
  var fb='';
  if(locked){
    fb='<div class="fb '+(ok?'good':'bad')+'" role="status"><p><b>'+(ok?'Correct. +15 XP':'Not quite.')+'</b>'+(ok?'':' The answer is “'+esc(q.options[q.correct])+'”.')+'</p>'+
      '<div><button class="btn btn-sm" data-act="quiz-next" data-key="qnext">Next question '+I('arrow')+'</button></div></div>';
  }
  return '<section class="card">'+
    '<div class="card-head"><div><p class="eyebrow">Practice</p><h2>Infinite quiz in '+S.lang+'</h2><p class="muted small">Endless questions at '+cap(rank())+' tier and below. Each correct answer earns 15 XP.</p></div>'+
    '<span class="streakpill">'+I('flame')+Q.streak+' in a row</span></div>'+
    '<div class="qbox"><p class="qtext">'+q.html+'</p>'+qBlock(q,Q.picked,locked,function(i){return 'data-act="quiz-pick" data-i="'+i+'"'})+'</div>'+
    (fb?'<div style="margin-top:16px">'+fb+'</div>':'')+
  '</section>';
}

function newExam(){
  var lang=S.lang,r=rank(),n=EXAM_COUNT[r];
  var all=items(lang,'master'),base=items(lang,r);
  var cur=shuffle(base.filter(function(x){return x.r===r})),low=shuffle(base.filter(function(x){return x.r!==r}));
  var chosen=cur.concat(low);
  var gen=[];
  for(var i=0;i<chosen.length&&gen.length<n;i++)gen.push(makeQ(chosen[i],all,Math.random()<0.5?0:1,lang));
  var qs;
  if(lang==='Spanish'){qs=shuffle(D.SPANISH_EXAM[r].map(fromBank).concat(gen)).slice(0,n)}
  else qs=gen;
  S.exam={qs:qs.map(function(q,i){q.id=i;return q}),ans:{},submitted:false,score:0,rankedTo:null,review:[]};
}
function vExam(){
  var E=S.exam,r=rank();
  if(!E.qs.length)newExam();E=S.exam;
  var head='<div class="card-head"><div><p class="eyebrow">Rank-up</p><h2>Final exam</h2>'+
    '<p class="muted small">Current rank: <b>'+cap(r)+'</b> · '+E.qs.length+' questions · a perfect score moves you up.</p></div>'+
    '<button class="btn btn-ghost btn-sm" data-act="exam-new">'+I('refresh')+'New questions</button></div>';
  if(!E.submitted){
    var answered=Object.keys(E.ans).length,total=E.qs.length;
    var list=E.qs.map(function(q,qi){
      return '<div class="qbox"><p class="qtext">'+(qi+1)+'. '+q.html+'</p>'+
        '<div class="opts" data-q="'+q.id+'">'+q.options.map(function(o,i){
          var on=E.ans[q.id]===i;
          return '<button class="opt'+(on?' on':'')+'" aria-pressed="'+on+'" data-act="exam-pick" data-q="'+q.id+'" data-i="'+i+'"'+(q.tl?' lang="'+LANGS[S.lang].tag+'"':'')+'>'+esc(o)+'</button>';
        }).join('')+'</div></div>';
    }).join('');
    return '<section class="card">'+head+'<div style="display:flex;flex-direction:column;gap:14px">'+list+
      '<button class="btn" id="exam-submit" data-act="exam-submit"'+(answered<total?' disabled':'')+'>Submit exam (<span id="exam-count">'+answered+'</span>/'+total+' answered)</button></div></section>';
  }
  var perfect=E.score===100;
  var msg=perfect
    ?(E.rankedTo?'You ranked up to <b>'+cap(E.rankedTo)+'</b>. Your lessons now use the new tier.':'You already hold the top rank. Excellent work.')
    :'You need 100% to rank up. Review the misses below and retake with fresh questions.';
  var review=E.review.length?'<ul class="review">'+E.review.map(function(x){
    return '<li><div>'+x.q+'</div><div class="small muted" style="margin-top:6px">Your answer: '+esc(x.yours)+' · Correct: <b style="color:var(--good)">'+esc(x.right)+'</b></div></li>';
  }).join('')+'</ul>':'';
  return '<section class="card">'+head+'<div class="result"><p class="eyebrow">'+(perfect?'Perfect score':'Keep going')+'</p><p class="big" style="color:'+(perfect?'var(--good)':'var(--warn)')+'">'+E.score+'%</p><p class="muted" style="max-width:46ch">'+msg+'</p>'+
    '<button class="btn" data-act="exam-new">Retake with fresh questions</button>'+review+'</div></section>';
}

var VIEWS={dashboard:vDashboard,vocab:vVocab,writing:vWriting,speaking:vSpeaking,practice:vPractice,exam:vExam};
function renderView(){$('#view').innerHTML=VIEWS[S.tab]()}
function render(){renderHeader();renderSide();renderView()}

/* ---------- navigation ---------- */
function setTab(t,fromHash){
  if(!VIEWS[t])t='dashboard';
  S.tab=t;
  if(!fromHash){try{if(location.hash!=='#'+t)location.hash=t}catch(e){}}
  render();
  try{window.scrollTo(0,0)}catch(e){}
}

/* ---------- modals ---------- */
var M={lang:'Spanish',level:'beginner'},lastFocus=null;
function openModal(html){
  lastFocus=document.activeElement;
  $('#modal-root').innerHTML='<div class="overlay" data-act="close-modal-bg">'+html+'</div>';
  var f=$('#modal-root button, #modal-root input');if(f)f.focus();
}
function closeModal(){
  $('#modal-root').innerHTML='';
  if(lastFocus&&lastFocus.focus){try{lastFocus.focus()}catch(e){}}
}
function onboardHtml(force){
  var langs=Object.keys(LANGS).map(function(l){
    return '<button type="button" class="lang-opt" data-act="ob-lang" data-lang="'+l+'" aria-pressed="'+(M.lang===l)+'">'+l+'<span lang="'+LANGS[l].tag+'">'+esc(LANGS[l].greet)+'</span></button>';
  }).join('');
  var lv=RANKS.map(function(x){
    return '<button type="button" class="level" data-act="ob-level" data-level="'+x+'" aria-pressed="'+(M.level===x)+'">'+x+'</button>';
  }).join('');
  return '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">'+
    '<div><h2 id="m-title">Welcome to LingoVerse</h2><p class="muted small" style="margin-top:6px">Choose your target language and current proficiency level to start.</p></div>'+
    '<div class="field"><span class="lab" style="font-size:13px;font-weight:600">Language</span><div class="langgrid">'+langs+'</div></div>'+
    '<div class="field"><span class="lab" style="font-size:13px;font-weight:600">Experience level</span><div class="levels">'+lv+'</div></div>'+
    '<div class="row"><button class="btn" data-act="ob-done" style="flex:1">Start learning</button>'+
    (!force ? '<button class="btn btn-ghost" data-act="close-modal">Cancel</button>' : '')+'</div>'+
  '</div>';
}
function authHtml(){
  return '<form class="modal" id="auth-form" role="dialog" aria-modal="true" aria-labelledby="m-title">'+
    '<div><h2 id="m-title">'+(S.user?'Your profile':'Create a profile')+'</h2><p class="muted small" style="margin-top:6px">Your name and progress are saved in this browser only.</p></div>'+
    '<div class="field"><label class="lab" for="auth-name">Display name</label><input type="text" id="auth-name" autocomplete="nickname" maxlength="40" value="'+esc(S.user?S.user.name:'')+'" placeholder="Your name"></div>'+
    '<div class="row"><button class="btn" type="submit" style="flex:1">Save profile</button>'+
    (S.user?'<button class="btn btn-ghost" type="button" data-act="signout">Remove</button>':'')+
    '<button class="btn btn-ghost" type="button" data-act="close-modal">Cancel</button></div>'+
  '</form>';
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var overlay=e.target.classList&&e.target.classList.contains('overlay');
  if(overlay){
    if (!S.onboarded) return; // Prevent closing by backdrop click on first visit
    closeModal();
    return;
  }
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,key=b.dataset.key;
  var keepFocus=true;
  switch(a){
    case 'nav':setTab(b.dataset.tab);return;
    case 'open-onboard':M={lang:S.lang,level:rank()};openModal(onboardHtml(false));return;
    case 'open-auth':openModal(authHtml());return;
    case 'close-modal':if(!S.onboarded)return; closeModal();return;
    case 'ob-lang':M.lang=b.dataset.lang;M.level=S.ranks[M.lang]||'beginner';$('#modal-root .overlay').innerHTML=onboardHtml(!S.onboarded);
      var l=$('[data-lang="'+M.lang+'"]');if(l)l.focus();return;
    case 'ob-level':M.level=b.dataset.level;$('#modal-root .overlay').innerHTML=onboardHtml(!S.onboarded);
      var lv=$('[data-level="'+M.level+'"]');if(lv)lv.focus();return;
    case 'ob-done':
      var changed=M.lang!==S.lang||M.level!==rank();
      S.lang=M.lang;S.ranks[M.lang]=M.level;S.onboarded=true;save();resetLearning(false);
      closeModal();render();
      toast(changed?'Switched to '+S.lang+' at '+cap(M.level)+'.':'Course set for '+S.lang+' ('+M.level+').');return;
    case 'signout':S.user=null;save();closeModal();renderHeader();toast('Profile removed.');return;
    case 'flip':S.flipped=!S.flipped;break;
    case 'prev':{var n=vocab(S.lang,rank()).length;S.card=S.card>0?S.card-1:n-1;S.flipped=false;break}
    case 'next':{var n2=vocab(S.lang,rank()).length;S.card=S.card<n2-1?S.card+1:0;S.flipped=false;break}
    case 'say-card':{var c=vocab(S.lang,rank())[S.card];if(c)speak(c.term);return}
    case 'write-check':checkWriting();break;
    case 'write-next':{
      var pool=prompts(S.lang,rank()),ni=S.write.idx;
      if(pool.length>1){while(ni===S.write.idx)ni=Math.floor(Math.random()*pool.length)}
      S.write={idx:ni,input:'',hide:S.write.hide,fb:null};break}
    case 'speak-play':{var p=prompts(S.lang,rank());speak(p[S.speak.idx%p.length].targetPhrase,0.9);return}
    case 'speak-slow':{var p2=prompts(S.lang,rank());speak(p2[S.speak.idx%p2.length].targetPhrase,0.6);return}
    case 'speak-done':S.speak.done=true;award(30);break;
    case 'speak-next':{var p3=prompts(S.lang,rank());S.speak={idx:(S.speak.idx+1)%p3.length,done:false};break}
    case 'quiz-pick':{
      if(S.quiz.picked!==null)return;
      S.quiz.picked=+b.dataset.i;
      if(S.quiz.picked===S.quiz.q.correct){S.quiz.streak++;award(15)}else S.quiz.streak=0;
      key='qnext';break}
    case 'quiz-next':newQuiz();break;
    case 'exam-pick':{
      var q=+b.dataset.q,i=+b.dataset.i;S.exam.ans[q]=i;
      $$('.opts[data-q="'+q+'"] .opt').forEach(function(o,oi){var on=oi===i;o.classList.toggle('on',on);o.setAttribute('aria-pressed',on)});
      var cnt=Object.keys(S.exam.ans).length,sb=$('#exam-submit');
      $('#exam-count').textContent=cnt;if(sb)sb.disabled=cnt<S.exam.qs.length;
      return}
    case 'exam-submit':submitExam();break;
    case 'exam-new':newExam();break;
    default:return;
  }
  renderView();
  if(a==='speak-done'||a==='quiz-pick')renderHeader();
  if(key&&keepFocus){var el=$('[data-key="'+key+'"]');if(el)el.focus()}
  if(a==='exam-new'||a==='exam-submit'){try{window.scrollTo(0,0)}catch(e){}}
});
document.addEventListener('input',function(e){
  if(e.target.id==='write-input')S.write.input=e.target.value;
});
document.addEventListener('change',function(e){
  if(e.target.id==='write-hide'){S.write.hide=e.target.checked;renderView()}
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='auth-form')return;
  e.preventDefault();
  var name=$('#auth-name').value.trim();
  if(!name){toast('Enter a display name.');return}
  S.user={name:name};save();closeModal();renderHeader();toast('Welcome, '+name+'. Profile saved.');
});
document.addEventListener('keydown',function(e){
  var m=$('#modal-root .modal');if(!m)return;
  if(e.key==='Escape'){if(S.onboarded) closeModal();return}
  if(e.key==='Tab'){
    var f=$$('button,input',m).filter(function(x){return !x.disabled});if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
window.addEventListener('hashchange',function(){
  var t=location.hash.slice(1);if(VIEWS[t]&&t!==S.tab)setTab(t,true);
});

/* ---------- actions ---------- */
function checkWriting(){
  var ta=$('#write-input'),raw=ta?ta.value:S.write.input;S.write.input=raw;
  if(!raw.trim()){toast('Type your answer first.');return}
  var p=curPrompt(),rule=RULES[rank()],res=scoreWriting(raw,p.targetPhrase,rule),passed=res.score>=rule.pass;
  S.write.fb={score:res.score,passed:passed,exact:res.exact,target:p.targetPhrase,raw:raw};
  if(passed)award(40);else toast('Below the '+cap(rank())+' pass mark. Try again.');
}
function submitExam(){
  var E=S.exam,correct=0,review=[];
  E.qs.forEach(function(q,i){
    var a=E.ans[q.id];
    if(a===q.correct)correct++;
    else review.push({q:(i+1)+'. '+q.html,yours:a===undefined?'(no answer)':q.options[a],right:q.options[q.correct]});
  });
  E.score=Math.round(correct/E.qs.length*100);E.submitted=true;E.review=review;
  if(E.score===100){
    var ci=RANKS.indexOf(rank());
    if(ci<RANKS.length-1){
      var nx=RANKS[ci+1];E.rankedTo=nx;S.ranks[S.lang]=nx;
      var keep=S.exam;resetLearning(true);S.exam=keep;
    }
    award(500);save();renderSide();
    toast(E.rankedTo?'Perfect score. Ranked up to '+cap(E.rankedTo)+'.':'Perfect score at the top rank.');
  }else{
    award(50);toast('Exam complete: '+E.score+'%. You need 100% to rank up.');
  }
}

/* ---------- boot ---------- */
load();
var t0=location.hash.slice(1);
if(VIEWS[t0])S.tab=t0;
if(S.tab==='practice')newQuiz();
render();

// Automatically prompt user to choose language on first visit if not onboarded
if(!S.onboarded){
  M={lang:S.lang,level:rank()};
  openModal(onboardHtml(true));
}
})();
</script>
